; LessSteam configuration. Changes are picked up automatically within a second.
; Keep comments on their own lines: inline "; comments" are not supported.

[General]
; Limit  - Limit Steam: throttle Steam while a game runs; the overlay, chat
;          and the Steam window stay usable.
; Slay   - Slay Steam: freeze everything the game does not need to run.
;          The Steam window, overlay and chat stop working until the game exits.
; Custom - use the per-process modes from the [Custom] section below.
Preset=Limit

; 1 = LessSteam does nothing and everything is restored. Toggled by the
; tray's "Pause"; exiting the helper sets it, starting the helper clears it.
Paused=0

; 1 = umpdc.dll starts LessSteamHelper.exe whenever Steam starts, elevated and
; without a UAC prompt. Needs LessSteamHelper.exe to have been run once.
; Toggled by the tray's "Autostart with Steam".
; "Start with Windows" is stored here as StartWithWindows by the tray menu.
AutostartWithSteam=1

; How often parked processes get their memory trimmed again, in ms (>= 1000).
; 0 = preset default (Limit: 10000, Slay: 1000). Trims are skipped while
; WebHelper is busy, e.g. while the overlay or chat is open.
TrimIntervalMs=0

; Write %TEMP%\LessSteam.log (1 = on, 0 = off). Every helper start begins a
; new log; the previous one is kept as LessSteam.prev.log.
Log=1

[Custom]
; Modes:
;   off      - leave the process alone
;   trim     - lowest memory priority + periodic working-set trim
;   throttle - trim + BELOW_NORMAL priority + Windows Efficiency Mode
;   idle     - trim + IDLE priority + Windows Efficiency Mode
;   freeze   - trim, then suspend the process until the game exits
;              (applied 15 seconds after the game starts)
; SteamClient (steam.exe) can never be frozen - games need it for the
; Steamworks API - so freeze is treated as idle for it.
; SteamService needs LessSteamHelper.exe running.
WebHelper=throttle
Overlay=trim
SteamClient=off
SteamService=idle
